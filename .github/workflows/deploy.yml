on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Set up devenv
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          export NIX_CONFIG='experimental-features = nix-command flakes'
          command -v devenv >/dev/null 2>&1 || nix profile add nixpkgs#devenv
          printf '%s\n' /nix/var/nix/profiles/default/bin "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          printf '%s\n' "NIX_CONFIG=$NIX_CONFIG" >> "$GITHUB_ENV"

      - name: Pull latest code
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: git pull origin master

      - name: Prepare Docker database migration
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          marker=.devenv/docker-migration-complete
          dump=.devenv/docker-postgres.dump

          if [ ! -f "$marker" ] && docker container inspect laravel-postgres >/dev/null 2>&1; then
            mkdir -p .devenv
            docker start laravel-postgres >/dev/null

            for container in laravel-nginx laravel-queue laravel-scheduler laravel-app; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                docker stop "$container"
              fi
            done

            docker exec laravel-postgres sh -c 'exec pg_dump --format=custom --no-owner --no-privileges --username="$POSTGRES_USER" "$POSTGRES_DB"' > "$dump"

            for container in laravel-redis laravel-postgres; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                docker stop "$container"
              fi
            done
          fi

      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          devenv --profile production processes down || true
          devenv --profile production up --detach server queue scheduler
